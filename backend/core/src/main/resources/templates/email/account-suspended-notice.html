<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>계정 정지 안내</title>
</head>
<body style="margin:0;padding:0;background:#ffffff;font-family:'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif;color:#111111;">
  <div style="max-width:560px;margin:0 auto;padding:32px 28px 24px;">
    <img src="cid:finsight-logo" alt="FinSight" width="140" style="display:block;width:140px;height:auto;margin:0 0 28px 0;border:0;outline:none;text-decoration:none;" />
    <h1 style="margin:0 0 16px;font-size:26px;line-height:1.3;font-weight:700;">계정 정지 안내</h1>
    <p style="margin:0 0 14px;font-size:15px;line-height:1.6;color:#222;">{{userName}}님, 안녕하세요.</p>
    <p style="margin:0 0 14px;font-size:15px;line-height:1.6;color:#222;">
      요청하지 않은 <strong>{{purposeLabel}}</strong> 인증 신고로 계정이 정지되었습니다.
    </p>
    <p style="margin:0 0 8px;font-size:14px;line-height:1.6;color:#333;">
      아이디: <strong>{{maskedUsername}}</strong><br />
      이메일: <strong>{{maskedEmail}}</strong>
    </p>
    <p style="margin:0 0 28px;font-size:15px;line-height:1.6;color:#222;">
      계정 복구가 필요하시면 관리자에게 문의해 주세요.
    </p>
    <div style="border-top:1px dashed #cfcfcf;padding-top:16px;">
      <p style="margin:0;font-size:12px;color:#8a8a8a;">© {{year}} {{appName}}</p>
    </div>
  </div>
</body>
</html>
