apiVersion: v1
kind: Secret
metadata:
  name: finsight-secrets
  namespace: finsight-k8s
type: Opaque
stringData:
  MYSQL_DATABASE: finsight
  MYSQL_USER: finsight
  MYSQL_PASSWORD: "CHANGE_ME"
  MYSQL_ROOT_PASSWORD: "CHANGE_ME"
  REDIS_PASSWORD: "CHANGE_ME"
  MINIO_ROOT_USER: minioadmin
  MINIO_ROOT_PASSWORD: "CHANGE_ME"
  JWT_SECRET: "CHANGE_ME_JWT_SECRET_AT_LEAST_32_CHARS"
  ENCRYPT_KEY: "CHANGE_ME_ENCRYPT_KEY"
  FINSIGHT_EDITOR_MINIO_ACCESS_KEY: minioadmin
  FINSIGHT_EDITOR_MINIO_SECRET_KEY: "CHANGE_ME"
  FINSIGHT_EDITOR_MINIO_BUCKET: finsight-editor
  # S3 (프로젝트 완성 후 MinIO 대체 시 사용)
  # AWS_ACCESS_KEY_ID: "CHANGE_ME"
  # AWS_SECRET_ACCESS_KEY: "CHANGE_ME"
  # AWS_REGION: "ap-northeast-2"
  # FINSIGHT_EDITOR_S3_BUCKET: "finsight-editor"
