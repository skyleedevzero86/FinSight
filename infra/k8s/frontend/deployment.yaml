apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: finsight-k8s
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: finsight-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
            - name: FINSIGHT_API_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: finsight-config
                  key: FINSIGHT_API_BASE_URL
            - name: FINSIGHT_API_PROXY_TIMEOUT_MS
              valueFrom:
                configMapKeyRef:
                  name: finsight-config
                  key: FINSIGHT_API_PROXY_TIMEOUT_MS
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
